<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS-TOPIK Master - Ôn Thi Xuất Khẩu Lao Động</title>
    <style>
        :root {
            --primary-color: #4a3fd7;
            --primary-hover: #3b31b3;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            font-size: 20px;
            font-weight: bold;
        }

        .top-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-btn.active, .nav-btn:hover {
            background: #eef2ff;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .donate-btn {
            background: #e83e8c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Sub-categories (Ngành nghề) */
        .category-bar {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cat-btn {
            padding: 6px 14px;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        /* Main Workspace Layout */
        .workspace {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 20px;
            min-height: 450px;
            display: flex;
            flex-direction: column;
        }

        /* Controls inside left panel */
        .action-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .action-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            color: white;
        }

        .btn-seq { background: #6366f1; }
        .btn-rand { background: #f59e0b; }
        .btn-replay { background: #0ea5e9; }
        .btn-stop { background: #ef4444; }
        .btn-toggle { background: #10b981; }

        .settings-inline {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #64748b;
            margin-left: auto;
        }

        .settings-inline input {
            width: 60px;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: center;
        }

        /* Question Display Area */
        .question-display {
            flex: 1;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #fafafa;
        }

        .q-title {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .answer-output {
            margin-top: 15px;
            font-size: 15px;
            color: #475569;
            font-style: italic;
        }

        /* Right Panel: Danh Sách Câu Hỏi */
        .panel-title {
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .question-list {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 5px;
        }

        .question-item {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .question-item:hover, .question-item.active {
            background: #eef2ff;
            color: var(--primary-color);
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <div class="logo-area">
            🎓 EPS-TOPIK Master
        </div>
        <div class="top-nav">
            <button class="nav-btn">💬 Nhắc Chữ</button>
            <button class="nav-btn active">🎙️ Vấn Đáp</button>
            <button class="nav-btn">🧮 Tính Toán & Đổi Đơn Vị</button>
            <button class="nav-btn">⚠️ Biển Báo & An Toàn Lao Động</button>
        </div>
        <button class="donate-btn">❤️ Ủng hộ tác giả</button>
    </header>

    <!-- Sub-categories -->
    <div class="category-bar">
        <button class="cat-btn active">📁 Sản xuất chế tạo</button>
        <button class="cat-btn">📁 Nông nghiệp</button>
        <button class="cat-btn">📁 Lâm nghiệp</button>
        <button class="cat-btn">📁 Ngư nghiệp</button>
        <button class="cat-btn">📁 Xây dựng</button>
        <button class="cat-btn">📁 Dịch vụ</button>
        <button class="cat-btn">📁 Khai thác mỏ</button>

    </div>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Left Panel -->
        <div class="panel">
            <div class="action-toolbar">
                <button class="action-btn btn-seq" id="playSeqBtn">▶ Phát tuần tự</button>
                <button class="action-btn btn-rand" id="playRandBtn">🔀 Ngẫu nhiên</button>
                <button class="action-btn btn-replay" id="replayBtn">🔄 Nghe lại</button>
                <button class="action-btn btn-stop" id="stopBtn">⏹ Dừng</button>
                
                <div class="settings-inline">
                    <span>Delay (ms):</span>
                    <input type="number" id="delayInput" value="1000">
                </div>
            </div>

            <div class="action-toolbar" style="background: #fff; margin-bottom: 15px;">
                <button class="action-btn btn-toggle" id="recordBtn">🎙️ Bắt đầu trả lời</button>
                <button class="action-btn" style="background: #64748b;" id="sampleAnswerBtn">📄 Xem trả lời mẫu</button>
            </div>

            <div class="question-display">
                <div class="q-title" id="currentQuestionText">Chưa chọn câu hỏi hoặc không có câu hỏi.</div>
                <div class="answer-output" id="currentAnswerText">Bấm "Bắt đầu trả lời" để nói vào micro...</div>
            </div>
        </div>

        <!-- Right Panel: Danh sách câu hỏi -->
        <div class="panel">
            <div class="panel-title">📋 Danh Sách Câu Hỏi</div>
            <div class="question-list" id="questionListContainer">
                <!-- Danh sách câu hỏi sẽ được load tự động qua JS -->
            </div>
        </div>
    </div>
</div>
