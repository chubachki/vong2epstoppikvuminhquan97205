<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS-TOPIK Master - Ôn Thi Phỏng Vấn Giọng Nói</title>
    <style>
        :root {
            --primary-color: #4a3fd7;
            --primary-hover: #3b31b3;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            font-size: 20px;
            font-weight: bold;
        }

        .top-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-btn.active, .nav-btn:hover {
            background: #eef2ff;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .donate-btn {
            background: #e83e8c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Sub-categories (Ngành nghề) */
        .category-bar {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cat-btn {
            padding: 6px 14px;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        /* Main Workspace Layout */
        .workspace {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 20px;
            min-height: 450px;
            display: flex;
            flex-direction: column;
        }

        .action-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .action-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            color: white;
        }

        .btn-seq { background: #6366f1; }
        .btn-rand { background: #f59e0b; }
        .btn-replay { background: #0ea5e9; }
        .btn-stop { background: #ef4444; }
        .btn-toggle { background: #10b981; }

        .settings-inline {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #64748b;
            margin-left: auto;
        }

        .settings-inline input {
            width: 60px;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: center;
        }

        /* Question Display Area */
        .question-display {
            flex: 1;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #fafafa;
        }

        .q-title {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .answer-output {
            margin-top: 15px;
            font-size: 15px;
            color: #475569;
            font-style: italic;
        }

        /* Right Panel: Danh Sách Câu Hỏi */
        .panel-title {
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .question-list {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 5px;
        }

        .question-item {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .question-item:hover, .question-item.active {
            background: #eef2ff;
            color: var(--primary-color);
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">🎓 EPS-TOPIK Master</div>
        <div class="top-nav">
            <button class="nav-btn active">🎙️ Vấn Đáp Phỏng Vấn</button>
        </div>
        <button class="donate-btn">❤️ Ủng hộ tác giả</button>
    </header>

    <!-- Chọn ngành nghề -->
    <div class="category-bar" id="categoryContainer">
        <button class="cat-btn active" onclick="switchCategory('chetao', this)">📁 Sản xuất chế tạo</button>
        <button class="cat-btn" onclick="switchCategory('nongnghiep', this)">📁 Nông nghiệp</button>
        <button class="cat-btn" onclick="switchCategory('ngunghiep', this)">📁 Ngư nghiệp</button>
        <button class="cat-btn" onclick="switchCategory('xaydung', this)">📁 Xây dựng</button>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Cột trái: Điều khiển & Hiển thị câu hỏi -->
        <div class="panel">
            <div class="action-toolbar">
                <button class="action-btn btn-seq" id="nextBtn">▶ Câu tiếp theo</button>
                <button class="action-btn btn-rand" id="randBtn">🔀 Ngẫu nhiên</button>
                <button class="action-btn btn-replay" id="replayBtn">🔄 Nghe câu hỏi</button>
                <button class="action-btn btn-stop" id="stopBtn">⏹ Dừng phát</button>
            </div>

            <div class="action-toolbar" style="background: #fff; margin-bottom: 15px;">
                <button class="action-btn btn-toggle" id="recordBtn">🎙️ Bắt đầu trả lời</button>
            </div>

            <div class="question-display">
                <div class="q-title" id="currentQuestionText">Đang tải câu hỏi...</div>
                <div class="answer-output" id="currentAnswerText">Bấm "Bắt đầu trả lời" để nói vào micro...</div>
            </div>
        </div>

        <!-- Cột phải: Danh sách câu hỏi theo ngành -->
        <div class="panel">
            <div class="panel-title">📋 Danh Sách Câu Hỏi (<span id="catNameTitle">Sản xuất chế tạo</span>)</div>
            <div class="question-list" id="questionListContainer"></div>
        </div>
    </div>
</div>

<script>
    // Ngân hàng câu hỏi phân theo ngành
    const questionBank = {
        chetao: [
            "1. 안녕 하십니까? 자기 소개를 해주세요. (Xin chào, hãy giới thiệu bản thân?)",
            "2. 한국어 공부를 얼마나 하셨습니까? (Bạn đã học tiếng Hàn được bao lâu rồi?)",
            "3. 이 회사에 지원한 동기가 무엇입니까? (Lý do bạn ứng tuyển vào công ty này là gì?)",
            "4. 프레스 작업을 해본 적이 있습니까? (Bạn đã từng làm công việc dập kim loại/press chưa?)",
            "5. 작업 중 손을 다치면 어떻게 해야 합니까? (Nếu bị thương ở tay khi làm việc bạn sẽ xử lý thế nào?)"
        ],
        nongnghiep: [
            "1. 비닐하우스에서 일해 본 적이 있습니까? (Bạn đã làm việc trong nhà kính bao giờ chưa?)",
            "2. 한국의 겨울 날씨는 추운데 괜찮습니까? (Mùa đông Hàn Quốc rất lạnh, bạn chịu được không?)",
            "3. 농사일은 육체적으로 힘든데 잘 할 수 있습니까? (Làm nông vất vả về thể lực, bạn làm tốt chứ?)",
            "4. 농약을 칠 때 어떤 보호구를 착용해야 합니까? (Khi phun thuốc trừ sâu cần đeo đồ bảo hộ gì?)"
        ],
        ngunghiep: [
            "1. 배를 타본 적이 있습니까? 멀미를 합니까? (Bạn đã từng đi tàu chưa? Có bị say sóng không?)",
            "2. 그물을 끌어올리는 작업은 힘든데 괜찮습니까? (Công việc kéo lưới rất nặng nhọc, bạn có chịu được không?)",
            "3. 바다에서 작업할 때 구명조끼를 꼭 입어야 합니까? (Khi làm việc trên biển có bắt buộc mặc áo phao không?)"
        ],
        xaydung: [
            "1. 건설 현장에서 일해 본 경험이 있습니까? (Bạn đã có kinh nghiệm làm việc ở công trường xây dựng chưa?)",
            "2. 높은 곳에서 일할 때 안전모와 안전대를 착용합니까? (Khi làm việc trên cao bạn có đội mũ và đeo dây an toàn không?)",
            "3. 무거운 물건을 들 수 있습니까? (Bạn có nâng được các vật nặng không?)"
        ]
    };

    let currentCategory = 'chetao';
    let currentIndex = 0;
    let recognition;
    let isRecording = false;

    const qTextEl = document.getElementById('currentQuestionText');
    const aTextEl = document.getElementById('currentAnswerText');
    const listContainer = document.getElementById('questionListContainer');
    const recordBtn = document.getElementById('recordBtn');

    // Chuyển ngành nghề
    function switchCategory(catKey, btnEl) {
        currentCategory = catKey;
        currentIndex = 0;
        
        // Cập nhật nút active
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        btnEl.classList.add('active');

        // Cập nhật tiêu đề cột danh sách
        const catNames = {
            chetao: "Sản xuất chế tạo",
            nongnghiep: "Nông nghiệp",
            ngunghiep: "Ngư nghiệp",
            xaydung: "Xây dựng"
        };
        document.getElementById('catNameTitle').textContent = catNames[catKey];

        updateView();
    }

    function renderQuestionList() {
        listContainer.innerHTML = '';
        const questions = questionBank[currentCategory];
        questions.forEach((q, index) => {
            const item = document.createElement('div');
            item.className = `question-item ${index === currentIndex ? 'active' : ''}`;
            item.textContent = q;
            item.onclick = () => {
                currentIndex = index;
                updateView();
            };
            listContainer.appendChild(item);
        });
    }

    function updateView() {
        const questions = questionBank[currentCategory];
        qTextEl.textContent = questions[currentIndex];
        aTextEl.textContent = 'Bấm "Bắt đầu trả lời" để ghi âm câu trả lời...';
        renderQuestionList();
    }

    // Đọc câu hỏi
    document.getElementById('replayBtn').addEventListener('click', () => {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(questionBank[currentCategory][currentIndex]);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        }
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (isRecording && recognition) recognition.stop();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
        const questions = questionBank[currentCategory];
        currentIndex = (currentIndex + 1) % questions.length;
        updateView();
    });

    document.getElementById('randBtn').addEventListener('click', () => {
        const questions = questionBank[currentCategory];
        currentIndex = Math.floor(Math.random() * questions.length);
        updateView();
    });

    // Nhận diện giọng nói trả lời
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'ko-KR';

        recognition.onstart = () => {
            isRecording = true;
            recordBtn.style.background = '#ef4444';
            recordBtn.innerHTML = '⏹️ Dừng trả lời';
            aTextEl.textContent = 'Đang lắng nghe bạn nói...';
        };

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            aTextEl.textContent = transcript;
        };

        recognition.onend = () => {
            isRecording = false;
            recordBtn.style.background = '#10b981';
            recordBtn.innerHTML = '🎙️ Bắt đầu trả lời';
        };
    } else {
        recordBtn.disabled = true;
    }

    recordBtn.addEventListener('click', () => {
        if (!recognition) return;
        if (!isRecording) {
            recognition.start();
        } else {
            recognition.stop();
        }
    });

    // Khởi tạo
    updateView();
</script>

</body>
</html>
